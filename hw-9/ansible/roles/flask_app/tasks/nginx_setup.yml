# roles/flask_app/tasks/nginx_setup.yml - Nginx configuration tasks
---

- name: Create Nginx site configuration file {{ ansible_os_family }}
  template:
    src: nginx_site.conf.j2
    dest: "{{ nginx_config_debian }}"
    owner: root
    group: root
    mode: 0644
  notify: reload Nginx
  when: ansible_os_family == "Debian"

- name: Create Nginx site configuration file {{ ansible_os_family }}
  template:
    src: nginx_site.conf.j2
    dest: "{{ nginx_config_redhat }}"
    owner: root
    group: root
    mode: 0644
  notify: reload Nginx
  when: ansible_os_family == "RedHat"

- name: Create Nginx server configuration {{ ansible_os_family }}
  template:
    src: nginx.conf.j2
    dest: "{{ nginx_server_config_redhat }}"
    owner: root
    group: root
    mode: 0644
  notify: reload Nginx
  when: ansible_os_family == "RedHat"

- name: Enable Nginx site
  file:
    src: "{{ nginx_config_debian }}"
    dest: "{{ nginx_enabled }}"
    state: link
  notify: reload Nginx
  when: ansible_os_family == "Debian"

- name: Ensure Nginx is started and enabled
  service:
    name: nginx
    state: started
    enabled: yes
