# roles/ssh_key_deployment/tasks/main.yml - Tasks for ssh_key_setup role
---

- name: Ensure .ssh directory exists
  file:
    path: "{{ ssh_dir }}"
    state: directory
    mode: '0700'
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"

- name: Copy SSH public key to remote hosts
  authorized_key:
    user: "{{ remote_user }}"
    state: present
    key: "{{ lookup('file', ssh_key_file) }}"

- name: Ensure correct permissions on authorized_keys file
  file:
    path: "{{ authorized_keys_file }}"
    state: file
    mode: '0600'
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
